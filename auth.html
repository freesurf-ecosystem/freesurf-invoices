<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeSurf Invoices — Sign In</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" type="image/png" href="./public/logo-favicon.png" />
    <div class="page-shell page-shell-auth">
      <header class="hero hero-auth">
        <div>
          <p class="eyebrow">FreeSurf Invoices</p>
          <h1>Sign in or create an account to save invoice details later.</h1>
          <p class="lede">Create an account or sign in to save your business details for future invoices.</p>
        </div>
        <div class="hero-actions">
          <a class="button" href="./index.html">Back to generator</a>
        </div>
      </header>

      <main class="auth-layout">
        <section class="panel auth-panel">
          <div class="form-section auth-section-first">
            <div class="section-heading">
              <h2>Account</h2>
              <p>Use your email and password to access saved invoice information.</p>
            </div>
            <div class="auth-tabs" role="tablist" aria-label="Authentication tabs">
              <button id="show-sign-in" class="auth-tab auth-tab-active" type="button">Sign in</button>
              <button id="show-sign-up" class="auth-tab" type="button">Sign up</button>
            </div>

            <div class="auth-oauth">
              <button type="button" class="button button-secondary" id="btn-google">
                <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C37.2 44.6 44 39.9 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
                Continue with Google
              </button>
              <button type="button" class="button button-secondary" id="btn-apple">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                Continue with Apple
              </button>
              <div class="auth-oauth-or">or</div>
            </div>

            <form id="sign-in-form" class="stack-form auth-form">
              <label>
                Email
                <input name="email" type="email" placeholder="you@example.com" required />
              </label>
              <label>
                Password
                <input name="password" type="password" placeholder="Minimum 6 characters" required />
              </label>
              <button class="button" type="submit">Sign in</button>
            </form>

            <form id="sign-up-form" class="stack-form auth-form auth-form-hidden">
              <label>
                Email
                <input name="email" type="email" placeholder="you@example.com" required />
              </label>
              <label>
                Password
                <input name="password" type="password" placeholder="Minimum 6 characters" required />
              </label>
              <label>
                Confirm password
                <input name="confirmPassword" type="password" placeholder="Repeat password" required />
              </label>
              <button class="button" type="submit">Create account</button>
            </form>
            <p id="auth-feedback" class="auth-feedback" aria-live="polite"></p>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./js/auth.js"></script>
  </body>
</html>
